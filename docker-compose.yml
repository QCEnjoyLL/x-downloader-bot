services:
  api:
    image: aiogram/telegram-bot-api:latest
    container_name: xbot-api
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - ./telegram-api:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    image: orangeqiu/x-downloader-bot:latest
    container_name: xbot
    ports:
      - "3000:3000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=3000
      - POLLING=${POLLING:-true}
      - CLEANUP_VIDEOS=${CLEANUP_VIDEOS:-true}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-3}
      - DEBUG_UPDATES=${DEBUG_UPDATES:-false}
      - BROADCAST_RESOLVER_URL=${BROADCAST_RESOLVER_URL:-}
      - ALLOW_PRIVATE_DOWNLOADS=${ALLOW_PRIVATE_DOWNLOADS:-false}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_SETUP_KEY=${WEBHOOK_SETUP_KEY:-}
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    restart: unless-stopped
