services:
  api:
    image: aiogram/telegram-bot-api:latest
    container_name: xbot-api
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      # 必须启用 --local 模式，上传上限才会从 50MB 提升到约 2GB。
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./telegram-api:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    image: orangeqiu/x-downloader-bot:latest
    container_name: xbot
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=3000
      - POLLING=${POLLING:-true}
      - CLEANUP_VIDEOS=${CLEANUP_VIDEOS:-true}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-3}
      - UPDATE_CONCURRENCY=${UPDATE_CONCURRENCY:-8}
      - MAX_LINKS_PER_MESSAGE=${MAX_LINKS_PER_MESSAGE:-5}
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-10}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS:-}
      - ALLOWLIST_BYPASS_LIMITS=${ALLOWLIST_BYPASS_LIMITS:-true}
      - JOB_MAX_ATTEMPTS=${JOB_MAX_ATTEMPTS:-3}
      - DOWNLOAD_RETENTION_HOURS=${DOWNLOAD_RETENTION_HOURS:-24}
      - MAX_DOWNLOAD_DISK_GB=${MAX_DOWNLOAD_DISK_GB:-20}
      - MIN_FREE_DISK_GB=${MIN_FREE_DISK_GB:-1}
      - DEBUG_UPDATES=${DEBUG_UPDATES:-false}
      - BROADCAST_RESOLVER_URL=${BROADCAST_RESOLVER_URL:-}
      - ALLOW_PRIVATE_DOWNLOADS=${ALLOW_PRIVATE_DOWNLOADS:-false}
      # 传入 profile，让 Bot 在未显式配置 URL 时自动选择本地 API。
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_SETUP_KEY=${WEBHOOK_SETUP_KEY:-}
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    restart: unless-stopped
